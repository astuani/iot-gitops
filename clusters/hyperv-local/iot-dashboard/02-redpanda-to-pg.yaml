apiVersion: v1
kind: ConfigMap
metadata:
  name: redpanda-to-pg-config
  namespace: iot
data:
  connect.yaml: |
    input:
      kafka:
        addresses: ["redpanda-oci.redpanda.svc.cluster.local:19092"]
        topics: ["iot-telemetria"]
        consumer_group: "cg-postgres-writer"
        start_from_oldest: true

    output:
      sql_insert:
        driver: postgres
        dsn: "postgres://iot_user:IotSenhaSegura2026@iot-postgres:5432/iot_telemetria?sslmode=disable"
        table: leituras_clima
        columns: ["criado_em", "device", "temperatura", "umidade"]
        args_mapping: |
          root = [ now(), this.device, this.temperatura, this.umidade ]
        init_statement: |
          CREATE TABLE IF NOT EXISTS leituras_clima (
            id SERIAL PRIMARY KEY,
            criado_em TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            device TEXT NOT NULL,
            temperatura DOUBLE PRECISION NOT NULL,
            umidade DOUBLE PRECISION NOT NULL
          );
          CREATE INDEX IF NOT EXISTS idx_leituras_criado_em ON leituras_clima (criado_em DESC);
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda-to-pg
  namespace: iot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda-to-pg
  template:
    metadata:
      labels:
        app: redpanda-to-pg
    spec:
      containers:
        - name: connect
          image: docker.redpanda.com/redpandadata/connect:latest
          args: ["run", "/etc/connect/connect.yaml"]
          volumeMounts:
            - name: config
              mountPath: /etc/connect
      volumes:
        - name: config
          configMap:
            name: redpanda-to-pg-config
