apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  namespace: redpanda
  labels:
    app: redpanda
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      securityContext:
        fsGroup: 101
      containers:
        - name: redpanda
          image: docker.io/redpandadata/redpanda:v24.2.11
          command:
            - /usr/bin/rpk
            - redpanda
            - start
            - --smp=1
            - --memory=1G
            - --reserve-memory=0M
            - --overprovisioned
            - --node-id=0
            - --check=false
            - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
            - --advertise-kafka-addr=internal://redpanda.redpanda.svc.cluster.local:9092,external://redpanda-oci.redpanda.svc.cluster.local:19092
            - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
            - --advertise-pandaproxy-addr=internal://redpanda.redpanda.svc.cluster.local:8082,external://redpanda-oci.redpanda.svc.cluster.local:18082
            - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
            - --rpc-addr=0.0.0.0:33145
            - --advertise-rpc-addr=redpanda-0.redpanda.redpanda.svc.cluster.local:33145
          ports:
            - name: kafka-int
              containerPort: 9092
            - name: kafka-ext
              containerPort: 19092
            - name: admin
              containerPort: 9644
            - name: schema
              containerPort: 8081
            - name: proxy
              containerPort: 8082
            - name: rpc
              containerPort: 33145
          volumeMounts:
            - name: datadir
              mountPath: /var/lib/redpanda/data
  volumeClaimTemplates:
    - metadata:
        name: datadir
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: oci-bv
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: redpanda
spec:
  selector:
    app: redpanda
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
    - name: admin
      port: 9644
      targetPort: 9644
    - name: schema
      port: 8081
      targetPort: 8081
    - name: proxy
      port: 8082
      targetPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda-external
  namespace: redpanda
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "redpanda-oci"
spec:
  selector:
    app: redpanda
  ports:
    - name: kafka-ext
      port: 19092
      targetPort: 19092
