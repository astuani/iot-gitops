apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mosquitto-local
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/astuani/iot-gitops.git
    targetRevision: main
    path: clusters/hyperv-local/mosquitto
  destination:
    server: https://k8s-local-api.argocd.svc.cluster.local
    namespace: iot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
