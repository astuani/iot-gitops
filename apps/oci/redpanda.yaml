apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redpanda-oci
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/astuani/iot-gitops.git
    targetRevision: main
    path: clusters/oci/redpanda
  destination:
    server: https://kubernetes.default.svc
    namespace: redpanda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
